[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-revenue-agent"
version = "1.0.0"
description = "Agent commercial autonome — le moteur de décision est le produit"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph>=1.0.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
revenue-agent = "revenue_agent.entrypoints.cli:main"

# Déclaration explicite : `trigger/` contient le code TypeScript des tâches Trigger.dev et ne
# doit pas être vu comme un paquet Python. Sans cette restriction, la détection automatique de
# setuptools refuse de construire ("Multiple top-level packages discovered in a flat-layout").
[tool.setuptools.packages.find]
include = ["revenue_agent*"]

# Les prompts sont lus à l'exécution depuis le paquet : sans cette ligne, ils manqueraient à
# l'installation (une installation éditable les trouverait quand même, pas une roue).
[tool.setuptools.package-data]
revenue_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]
